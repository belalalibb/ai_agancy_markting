[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-growth-os"
version = "0.1.0"
description = "AI Marketing Platform (AI Growth OS) — Modular Monolith backend built with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AI Marketing Platform Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # SPRINT-04 auth (D-054 allow-listed licences; no python-jose / passlib).
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "unit: isolated unit tests (no I/O)",
    "contract: contract tests against mocked external APIs",
    "integration: requires a real PostgreSQL (TEST_DATABASE_URL); skipped otherwise",
]
filterwarnings = [
    "error::DeprecationWarning:src.*",
]

# ---------------------------------------------------------------------------
# ruff (PEP 8 / lint / import sorting)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests", "alembic", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ANN", # flake8-annotations (type hints)
    "S",   # flake8-bandit (security)
    "TID", # flake8-tidy-imports — No-Bypass banned-api rule (D-068)
]
ignore = [
    "ANN401", # Any in **kwargs is acceptable at boundaries
]

# SPRINT-07 B-0 / D-068 No-Bypass: no HTTP client or model SDK outside the gateway, the Meta
# client and src/core (mirrored by tests/modules/ai_gateway/test_contract.py::test_no_bypass).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Use AIGateway (D-068)"
"openai".msg = "Use AIGateway (D-068)"
"anthropic".msg = "Use AIGateway (D-068)"
"litellm".msg = "Use AIGateway (D-068)"
"google.generativeai".msg = "Use AIGateway (D-068)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN", "SLF001", "TID251"]
"src/modules/ai_gateway/**" = ["TID251"]
"src/modules/social_connect/meta_client.py" = ["TID251"]
"src/core/**" = ["TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
# SPRINT-08 A-2: SQLAlchemy async runs every flush()/execute() inside greenlet_spawn; without
# greenlet tracing that code is invisible to coverage (greenlet ships with SQLAlchemy — no new
# dependency).
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
