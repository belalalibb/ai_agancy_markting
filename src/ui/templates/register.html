{% extends "base.html" %}
{% block title %}{{ t("register.title") }}{% endblock %}
{% block content %}
<article data-screen="register">
  <h1>{{ t("register.title") }}</h1>
  {% if error %}<p role="alert" data-error>{{ error }}</p>{% endif %}
  <form method="post" action="/app/register">
    <label>{{ t("login.email") }}
      <input type="email" name="email" value="{{ form.email or '' }}" required autofocus autocomplete="email">
    </label>
    <label>{{ t("login.password") }}
      <input type="password" name="password" required minlength="10" autocomplete="new-password">
    </label>
    <label>{{ t("register.password_confirm") }}
      <input type="password" name="password_confirm" required minlength="10" autocomplete="new-password">
    </label>
    <label>{{ t("register.tenant_name") }}
      <input type="text" name="tenant_name" value="{{ form.tenant_name or '' }}" required maxlength="255">
    </label>
    <details>
      <summary>{{ t("register.advanced") }}</summary>
      <label>{{ t("register.tenant_slug") }}
        <input type="text" name="tenant_slug" value="{{ form.tenant_slug or '' }}" pattern="[a-z0-9-]{3,64}" placeholder="org-xxxxxxxx">
        <small>{{ t("register.slug_hint") }}</small>
      </label>
    </details>
    <button type="submit">{{ t("register.submit") }}</button>
  </form>
  <p><a href="/app/login" data-link="login">{{ t("register.have_account") }}</a></p>
</article>
{% endblock %}
