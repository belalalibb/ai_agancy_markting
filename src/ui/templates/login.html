{% extends "base.html" %}
{% block title %}{{ t("login.title") }}{% endblock %}
{% block content %}
<article>
  <h1>{{ t("login.title") }}</h1>
  {% if error %}<p role="alert" data-error>{{ error }}</p>{% endif %}
  <form method="post" action="/app/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ t("login.email") }}
      <input type="email" name="email" value="{{ email }}" required autofocus>
    </label>
    <label>{{ t("login.password") }}
      <input type="password" name="password" required>
    </label>
    <button type="submit">{{ t("login.submit") }}</button>
  </form>
  <p><a href="/app/register" data-link="register">{{ t("login.register") }}</a></p>
</article>
{% endblock %}
